name: Daily K Car All-C2C Mobile App Auto-Update (08:00 KST)

on:
  schedule:
    # 다중 분산 스케줄 (ubuntu-latest 고속 풀 사용 + 07:22 / 07:42 / 07:56 / 08:11 / 08:27 KST 다중 안전망)
    - cron: '22 22 * * *'
    - cron: '42 22 * * *'
    - cron: '56 22 * * *'
    - cron: '11 23 * * *'
    - cron: '27 23 * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-c2c-vehicles:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Fresh 4-Platform C2C Dataset (K Car, Daangn, Encar, KB)
        shell: pwsh
        run: |
          $today = ([DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9))).ToString("yyyy-MM-dd")
          if ("${{ github.event_name }}" -eq "schedule" -and (Test-Path "./data/c2c_vehicles_data.js")) {
            $cur = [System.IO.File]::ReadAllText("./data/c2c_vehicles_data.js", [System.Text.Encoding]::UTF8)
            if ($cur -match ('"crawledDate":\s*"' + [regex]::Escape($today) + '"')) {
              Write-Host "Already updated for $today on schedule; skipping."
              exit 0
            }
          }
          pwsh -NoProfile -File "./scripts/build_data.ps1"

      - name: Commit & Push Updated Dataset to GitHub Pages
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/c2c_vehicles_data.js
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $dt = ([DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9))).ToString("yyyy-MM-dd HH:mm")
            git commit -m "chore(data): auto-update 4-platform C2C vehicles ($dt KST)"
            git fetch origin main
            $remoteJs = git show origin/main:data/c2c_vehicles_data.js
            $today = ([DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9))).ToString("yyyy-MM-dd")
            if ($remoteJs -match '"crawledDate":\s*"' + [regex]::Escape($today) + '"' -and $remoteJs -match '"livePlatformsCount":\s*4') {
              Write-Host "Remote main already received complete 4/4 Korean-IP dataset for $today; keeping 4/4 dataset."
              exit 0
            }
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              Write-Host "Rebase conflict with newer commit on main; keeping remote dataset."
              exit 0
            }
            git push origin main
          } else {
            Write-Host "No changes in data/c2c_vehicles_data.js."
          }
