name: Daily K Car All-C2C Mobile App Auto-Update (08:00 KST)

on:
  schedule:
    # 한국시간(KST) 매일 오전 08:00 정각 자동 실행 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-c2c-vehicles:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Fresh 4-Platform C2C Dataset (K Car, Daangn, Encar, KB)
        shell: pwsh
        run: |
          tzutil /s "Korea Standard Time"
          pwsh -NoProfile -ExecutionPolicy Bypass -File "./scripts/build_data.ps1"

      - name: Commit & Push Updated Dataset to GitHub Pages
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/c2c_vehicles_data.js
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $dt = ([DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9))).ToString("yyyy-MM-dd HH:mm")
            git pull --rebase origin main
            git commit -m "chore(data): auto-update 4-platform C2C vehicles ($dt KST)"
            git push origin main
          } else {
            Write-Host "No changes in data/c2c_vehicles_data.js."
          }
